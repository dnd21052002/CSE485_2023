<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phòng thử đồ ảo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Phòng thử đồ ảo <small>chạy 100% trên máy bạn</small></h1>
    <div class="status">
      <span id="camStatus" class="pill warn">Camera…</span>
      <span id="trkStatus" class="pill warn">Tracker…</span>
      <span id="fps" class="pill">– FPS</span>
      <span id="srvStatus" class="pill warn">AI…</span>
    </div>
  </header>

  <main>
    <section class="views">
      <div class="view" title="Kéo thả ảnh áo vào đây">
        <div class="label">Live AR · realtime</div>
        <canvas id="stage" class="mirror"></canvas>
        <video id="video" playsinline muted hidden></video>
      </div>
      <div class="view" id="aiPanel">
        <div class="label">AI try-on · CatVTON trên GPU</div>
        <img id="aiResult" alt="">
        <div class="placeholder">Bấm <b>Chụp &amp; thử bằng AI</b> hoặc bật <b>Live AI</b></div>
        <div id="aiInfo" class="info"></div>
      </div>
    </section>

    <aside>
      <h2>Trang phục</h2>
      <div id="catalog" class="catalog"></div>
      <label class="upload">+ Tải ảnh quần áo (ảnh sản phẩm nền trắng)
        <input id="upload" type="file" accept="image/*" multiple hidden>
      </label>
      <label>Loại
        <select id="clothType">
          <option value="upper">Áo (thân trên)</option>
          <option value="lower">Quần / váy ngắn</option>
          <option value="overall">Váy liền / bộ</option>
        </select>
      </label>

      <h2>AI chất lượng cao</h2>
      <label>Chất lượng
        <select id="preset">
          <option value="balanced">Cân bằng · 576×768</option>
          <option value="best">Đẹp nhất · 768×1024</option>
          <option value="live">Nhanh · 384×512</option>
        </select>
      </label>
      <label>Số bước khử nhiễu <input id="steps" type="number" min="4" max="100" value="25"></label>
      <label>Guidance <input id="guidance" type="number" min="1" max="7" step="0.1" value="2.5"></label>
      <label>Mask
        <select id="maskMode">
          <option value="auto">AutoMasker (DensePose + SCHP)</option>
          <option value="client">Từ trình duyệt (MediaPipe)</option>
        </select>
      </label>
      <button id="snap" class="primary">Chụp &amp; thử bằng AI</button>
      <label class="row"><input id="liveAI" type="checkbox"> Live AI (liên tục, preset nhanh)</label>
      <a id="download" download="tryon.jpg" class="btn">Tải ảnh kết quả</a>

      <details>
        <summary>Tinh chỉnh AR</summary>
        <label class="row"><input id="showAR" type="checkbox" checked> Hiện áo AR</label>
        <label class="row"><input id="flip" type="checkbox" checked> Chữ/logo đọc đúng chiều (gương)</label>
        <label class="row"><input id="sleeves" type="checkbox" checked> Tay áo bám theo cánh tay</label>
        <label>Độ rộng <input id="width" type="range" min="0.8" max="1.6" step="0.01" value="1.15"></label>
        <label>Độ dài <input id="length" type="range" min="0.7" max="1.4" step="0.01" value="1"></label>
        <label>Dịch dọc <input id="offsetY" type="range" min="-0.4" max="0.4" step="0.01" value="0"></label>
        <label>Ánh sáng <input id="shade" type="range" min="0" max="1" step="0.01" value="0.6"></label>
        <label>Góc tay áo (ảnh gốc) <input id="sleeveAngle" type="range" min="0" max="90" step="1" value="50"></label>
      </details>
    </aside>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
